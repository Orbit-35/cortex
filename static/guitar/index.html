<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<title>Cortex · Tuner</title>
<link rel="stylesheet" href="/core/theme.css">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:active { transform: scale(.97); }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .wrap { max-width: 520px; margin-inline: auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100dvh; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 0 6px; }
  .top h1 { font-size: 22px; margin: 0; flex: 1; }
  .iconbtn { background: none; border: 0; width: 44px; height: 44px; display: grid; place-items: center; color: var(--text); border-radius: 12px; text-decoration: none; }
  .iconbtn:active { background: var(--card); }

  .tunbtn { display: flex; align-items: center; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 0 10px 0 16px; min-height: 42px; font-size: 15px; font-weight: 600; max-width: 55%; }
  .tunbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tunbtn svg { width: 18px; height: 18px; flex: none; color: var(--muted); }

  /* Bottom sheets: tuning list and custom tuning editor */
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .55); display: flex; align-items: flex-end; justify-content: center; }
  .panel { width: 100%; max-width: 520px; max-height: 88dvh; overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-bottom: 0;
    border-radius: 20px 20px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 10px; }
  .panel h2 { font-size: 20px; margin: 0 0 8px; }
  .panel h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .04em; }
  .trow { display: flex; align-items: center; gap: 4px; border-radius: 12px; }
  .trow:active { background: var(--card); }
  .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; background: none; border: 0; text-align: left; }
  .pick .t { flex: 1; min-width: 0; }
  .pick b { display: block; font-weight: 600; }
  .pick small { color: var(--muted); font-size: 14px; letter-spacing: .03em; }
  .trow.on b { color: var(--accent); }
  .mark { width: 22px; height: 22px; color: var(--accent); flex: none; display: grid; place-items: center; }
  .edit { flex: none; width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; color: var(--muted); border-radius: 10px; }
  .addrow { color: var(--accent); font-weight: 600; }
  .field { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
  .field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 17px; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; -webkit-user-select: text; user-select: text; }
  .field input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .srow { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .srow .lab { flex: 1; font-size: 15px; color: var(--muted); }
  .step { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .step button { width: 44px; height: 44px; background: none; border: 0; font-size: 22px; }
  .step .nt { min-width: 64px; width: auto; height: 44px; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
  .step .nt sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  .countrow { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 6px; font-size: 15px; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  .actions button { flex: 1; min-height: 52px; border-radius: 14px; font-size: 16px; font-weight: 700; }
  .btn2 { background: var(--card); border: 1px solid var(--line); }
  .btn1 { background: var(--accent); border: 0; color: var(--on-accent); }
  .btndel { background: none; border: 0; color: var(--danger); min-height: 48px; width: 100%; margin-top: 8px; font-weight: 600; border-radius: 14px; }

  /* The meter (D47): an analogue-style needle over a fine scale with green/amber/pink zones.
     --st is the state colour: pink (far), amber (close), green (in tune). */
  .stage { --st: var(--accent); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 4px 0 8px; }
  .stage.state-near { --st: var(--warn); }
  .stage.state-in { --st: var(--good); }
  .stage.state-idle { --st: var(--muted); }
  .meter { width: 100%; max-width: 500px; background: radial-gradient(120% 90% at 50% 100%, var(--card) 0%, var(--bg) 70%);
    border: 1px solid var(--line); border-radius: 24px; padding: 10px 6px 0; }
  .gauge { display: block; width: 100%; overflow: visible; }
  .gauge .tk { stroke: var(--muted); stroke-linecap: round; opacity: .45; }
  .gauge .tk.m5 { opacity: .7; }
  .gauge .tk.m10 { stroke: var(--text); opacity: .85; stroke-width: 2.5; }
  .gauge .tk.m0 { stroke: var(--good); opacity: 1; stroke-width: 3.5; }
  .gauge .num { fill: var(--muted); font-size: 13px; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .gauge .num.zero { fill: var(--good); font-weight: 700; }
  .gauge .zone { fill: none; stroke-width: 7; }
  .gauge .z-far { stroke: var(--accent); opacity: .35; }
  .gauge .z-near { stroke: var(--warn); opacity: .55; }
  .gauge .z-in { stroke: var(--good); opacity: .9; }
  .gauge .sym { fill: var(--muted); font-size: 22px; text-anchor: middle; font-weight: 600; }
  .gauge .needle { fill: var(--st); transition: fill .2s; }
  .gauge .glow { fill: var(--st); opacity: 0; transition: opacity .25s, fill .2s; }
  .state-in .gauge .glow { opacity: .35; }
  .state-idle .gauge .needle { opacity: .35; }
  .gauge .cap { fill: var(--card2); stroke: var(--st); stroke-width: 3; transition: stroke .2s; }
  .gauge .capdot { fill: var(--st); transition: fill .2s; }

  .notes { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 4px; }
  .nb { font-size: 22px; font-weight: 700; color: var(--muted); opacity: .55; min-width: 40px; text-align: center; }
  .note { font-size: clamp(76px, 24vw, 108px); font-weight: 800; line-height: 1; display: flex; align-items: baseline; transition: color .2s; }
  .note sub { font-size: .3em; font-weight: 600; color: var(--muted); margin-left: 3px; vertical-align: baseline; }
  .state-idle .note { color: var(--line); }
  .state-in .note { color: var(--good); }
  .cents { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--st); min-height: 38px; line-height: 38px; transition: color .2s; }
  .cents small { font-size: 15px; color: var(--muted); font-weight: 500; margin-left: 8px; }
  .lights { display: flex; align-items: center; gap: 12px; }
  .led { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line);
    color: var(--line); transition: background .15s, color .15s, box-shadow .15s; }
  .led svg { width: 22px; height: 22px; }
  .state-far.flat .led.l, .state-near.flat .led.l, .state-far.sharp .led.r, .state-near.sharp .led.r {
    color: var(--on-accent); background: var(--st); border-color: transparent; box-shadow: 0 0 18px var(--st); }
  .status { min-width: 150px; font-size: 18px; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center;
    justify-content: center; gap: 6px; color: var(--muted); background: var(--card); border: 1px solid var(--line); transition: background .2s, color .2s; }
  .state-far .status, .state-near .status { color: var(--st); }
  .state-in .status { color: var(--on-accent); background: var(--good); border-color: transparent; box-shadow: 0 0 20px rgb(76 195 138 / .45); }
  .status svg { width: 20px; height: 20px; }
  .micmsg { font-size: 14px; color: var(--muted); text-align: center; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .micmsg .err { color: var(--danger); }
  .micmsg button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; }

  .strings { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
  .str { position: relative; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 18px; font-weight: 700; display: grid; place-items: center; padding: 0; }
  .str.active { border-color: var(--accent); color: var(--accent); }
  .str.locked { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .str.done::after { content: ""; position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 50%; background: var(--good); border: 2px solid var(--bg); }
  .hint { font-size: 13px; color: var(--muted); text-align: center; margin: 8px 0 0; min-height: 18px; }

  .bottom { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .pill { display: flex; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .pill button { background: none; border: 0; width: 44px; height: 44px; font-size: 22px; color: var(--text); }
  .pill span { font-size: 15px; min-width: 92px; text-align: center; font-variant-numeric: tabular-nums; }
  .ref { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; min-height: 46px; font-size: 15px; font-weight: 600; }
  .ref:disabled { opacity: .4; }

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="iconbtn" href="/" aria-label="All apps"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></a>
    <h1>Tuner</h1>
    <button class="tunbtn" id="tunbtn" aria-haspopup="dialog">
      <span id="tunname">Standard</span>
      <svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>

  <div class="stage state-idle" id="stage">
    <div class="meter"><svg class="gauge" viewBox="0 0 400 226" aria-hidden="true" id="gauge"></svg></div>
    <div class="notes"><span class="nb" id="nprev"></span><div class="note" id="note" aria-live="polite">–</div><span class="nb" id="nnext"></span></div>
    <div class="cents" id="cents"></div>
    <div class="lights">
      <span class="led l" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></span>
      <div class="status" id="status">Play a string</div>
      <span class="led r" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>
    </div>
    <div class="micmsg" id="micmsg" hidden></div>
  </div>

  <div class="strings" id="strings"></div>
  <p class="hint" id="hint"></p>

  <div class="bottom">
    <div class="pill" aria-label="Reference pitch">
      <button id="a4down" aria-label="Lower reference pitch">−</button>
      <span id="a4">A4 440 Hz</span>
      <button id="a4up" aria-label="Raise reference pitch">+</button>
    </div>
    <button class="ref" id="ref" aria-label="Play reference tone">
      <svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span id="reflabel">Hear</span>
    </button>
  </div>
</div>

<div class="sheet" id="picker" hidden role="dialog" aria-modal="true" aria-label="Choose tuning"><div class="panel" id="pickerpanel"></div></div>
<div class="sheet" id="editor" hidden role="dialog" aria-modal="true" aria-label="Custom tuning"><div class="panel" id="editorpanel"></div></div>

<script type="module" src="/guitar/app.js"></script>
</body>
</html>
