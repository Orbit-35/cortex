<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cortex · Lifting</title>
<style>
  :root {
    --bg: #111418; --card: #1b2027; --card2: #222832; --line: #2a313b; --text: #e8ecf1;
    --muted: #8b95a3; --accent: #4f9cff; --danger: #ff6b6b; --good: #4cc38a; --warn: #f5a524;
    --grid: #232a33; --nav-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:active { transform: scale(.98); }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px;
  }
  textarea { resize: vertical; min-height: 48px; font-size: 16px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

  /* Layout: a page column, a top bar, and the bottom tab bar */
  .wrap { max-width: 560px; margin-inline: auto; padding: 0 16px; }
  .top {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 0 10px;
  }
  .top h1 { font-size: 26px; margin: 0; }
  main { padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
  .sync { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .sync.ok::before { background: var(--good); }
  .sync.pending::before { background: var(--warn); }

  nav.tabbar {
    position: fixed; inset: auto 0 0 0; z-index: 10; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabbar .in { max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: repeat(5, 1fr); }
  nav.tabbar button {
    background: none; border: 0; height: var(--nav-h); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600;
  }
  nav.tabbar button[aria-selected="true"] { color: var(--accent); }
  nav.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Shared bits */
  .primary {
    width: 100%; min-height: 56px; border: 0; border-radius: 14px; background: var(--accent);
    color: #fff; font-size: 18px; font-weight: 700;
  }
  .primary.sm { width: auto; min-height: 40px; padding: 0 18px; font-size: 16px; border-radius: 10px; }
  .secondary {
    width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); font-size: 16px; font-weight: 600;
  }
  .ghost { background: none; border: 0; color: var(--muted); min-height: 44px; padding: 0 8px; }
  .danger { color: var(--danger); }
  .stack > * + * { margin-top: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  h2 { font-size: 15px; color: var(--muted); margin: 28px 0 8px; font-weight: 600; }
  .empty { color: var(--muted); font-size: 15px; padding: 24px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; }
  .chip {
    flex: none; font-size: 15px; background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; min-height: 40px;
  }
  .chip.on { border-color: var(--accent); color: var(--accent); }

  /* Log tab */
  .live { border-color: var(--accent); display: flex; align-items: center; gap: 12px; }
  .live .grow { flex: 1; min-width: 0; }
  .live b { display: block; }
  .wcard { width: 100%; text-align: left; display: block; }
  .wcard + .wcard { margin-top: 10px; }
  .wcard .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .wcard .name { font-weight: 700; }
  .wcard .lines { margin-top: 8px; font-size: 15px; }
  .wcard .line { display: flex; justify-content: space-between; gap: 8px; }
  .wcard .line span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wcard .notes { margin-top: 6px; font-size: 14px; color: var(--muted); white-space: pre-wrap; }

  /* Full-screen sheets (workout editor, exercise picker) */
  .sheet {
    position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto;
    overscroll-behavior: contain;
  }
  .sheet-top {
    position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px;
    padding: calc(8px + env(safe-area-inset-top)) 0 8px;
  }
  .sheet-top .title { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .back { background: none; border: 0; font-size: 30px; line-height: 1; min-height: 48px; color: var(--text); }
  .sheet-body { padding: 16px 0 calc(40px + env(safe-area-inset-bottom)); }
  .ed-name { font-size: 22px; font-weight: 700; background: none; border-color: transparent; padding-inline: 0; }
  .ed-name:focus { outline: none; border-bottom: 2px solid var(--accent); border-radius: 0; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fields label { font-size: 13px; color: var(--muted); }
  .fields input { margin-top: 4px; }
  .dur { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; margin-top: 4px; }
  .dur input { margin: 0; text-align: center; padding: 12px 4px; }

  .ex { margin-top: 22px; }
  .ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ex-head .exname { color: var(--accent); font-weight: 700; font-size: 18px; }
  .ex-menu { display: flex; gap: 8px; margin: 6px 0; }
  .ex-menu button { flex: 1; }
  .ex textarea { margin: 6px 0; }
  .grid { display: grid; gap: 6px; align-items: center; }
  .grid.live { grid-template-columns: 34px minmax(0, 1fr) 78px 62px 48px; }
  .grid.edit { grid-template-columns: 34px minmax(0, 1fr) 78px 62px; }
  .ghead { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding: 8px 0 2px; }
  .ghead.l { text-align: left; }
  .setrow { padding: 3px 0; border-radius: 10px; }
  .setrow.done { background: rgb(76 195 138 / .14); }
  .setno, .prev {
    background: none; border: 0; min-height: 44px; font-variant-numeric: tabular-nums;
  }
  .setno { font-weight: 700; color: var(--muted); }
  .prev { color: var(--muted); font-size: 14px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .setrow input { min-height: 44px; padding: 8px 4px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; background: var(--card2); }
  .tick {
    min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2);
    font-size: 20px; color: var(--muted);
  }
  .setrow.done .tick { background: var(--good); border-color: var(--good); color: #0b1a12; }
  .pr { font-size: 13px; }
  .addset { width: 100%; margin-top: 6px; min-height: 40px; border-radius: 10px; border: 0; background: var(--card); color: var(--muted); font-weight: 600; }
  .addex { margin-top: 26px; }

  /* Exercise picker */
  .pk-search { margin: 0; }
  .pkitem {
    width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 2px; min-height: 56px; display: flex; justify-content: space-between; gap: 8px; align-items: center;
  }
  .pkitem small { color: var(--muted); font-size: 13px; }
  .pkitem[disabled] { opacity: .4; }
  .pkitem.create { color: var(--accent); font-weight: 700; }

  /* Progress */
  .hero { margin: 18px 0 4px; }
  .hero .label { font-size: 14px; color: var(--muted); }
  .hero .big { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .hero .big small { font-size: 20px; color: var(--muted); font-weight: 600; }
  .hero .sub { font-size: 14px; color: var(--muted); }
  .chart { position: relative; margin: 16px 0 0; touch-action: pan-y; user-select: none; }
  .chart svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tip {
    position: absolute; top: 0; transform: translateX(-50%); pointer-events: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px 10px; font-size: 13px; white-space: nowrap;
  }
  .tip b { font-variant-numeric: tabular-nums; }
  .tip span { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  td.r, th.r { text-align: right; }

  /* Lists (exercises, settings) */
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .seg { display: inline-grid; grid-auto-flow: column; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; border-radius: 8px; padding: 6px 16px; min-height: 36px; color: var(--muted); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--line); color: var(--text); }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
    bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));
    background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 16px; font-size: 15px; max-width: calc(100% - 32px); text-align: center;
    box-shadow: 0 8px 24px rgb(0 0 0 / .4);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title">Log</h1>
    <div class="sync" id="sync" role="status"></div>
  </div>

  <main id="view-log"></main>
  <main id="view-progress" hidden><div class="chips" id="pchips"></div><div id="pbody"></div></main>
  <main id="view-exercises" hidden></main>
  <main id="view-body" hidden>
    <p class="empty">Bodyweight tracking is coming next: a chart with 1 week to all-time ranges, plus highest, lowest, average and weekly change.</p>
  </main>
  <main id="view-profile" hidden></main>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="log" aria-label="Log">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v3H9zM9 11h6M9 15h4"/></svg>Log</button>
    <button role="tab" data-tab="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24"><path d="M4 20h16M5 16l4-5 4 3 6-8"/></svg>Progress</button>
    <button role="tab" data-tab="exercises" aria-label="Exercises">
      <svg viewBox="0 0 24 24"><path d="M6.5 7v10M3.5 9.5v5M17.5 7v10M20.5 9.5v5M6.5 12h11"/></svg>Exercises</button>
    <button role="tab" data-tab="body" aria-label="Bodyweight">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a5 5 0 0 1 7 0M12 10l1.5-2"/></svg>Body</button>
    <button role="tab" data-tab="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</button>
  </div>
</nav>

<section class="sheet" id="editor" hidden aria-label="Workout"></section>
<section class="sheet" id="picker" hidden aria-label="Choose exercise"></section>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/lifting/app.js"></script>
</body>
</html>
