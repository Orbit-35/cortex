<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Cortex · Lifting</title>
<style>
  :root {
    --bg: #111418; --card: #1b2027; --line: #2a313b; --text: #e8ecf1;
    --muted: #8b95a3; --accent: #4f9cff; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    max-width: 520px; margin-inline: auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 16px; }
  h1 { font-size: 20px; margin: 0; color: var(--muted); font-weight: 600; }
  .sync { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .sync.ok::before { background: #4cc38a; }
  .sync.pending::before { background: #f5a524; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; font: inherit; font-size: 20px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; min-height: 56px;
  }
  input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 2px; }
  .chip {
    flex: none; font: inherit; font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 14px; min-height: 44px;
  }
  .chip.on { border-color: var(--accent); color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 6px; }
  .stepper input { text-align: center; padding: 14px 4px; }
  .step {
    font: inherit; font-size: 24px; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; min-height: 56px;
  }
  .log {
    width: 100%; margin-top: 20px; min-height: 64px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font: inherit; font-size: 20px; font-weight: 700;
  }
  .log:active, .step:active, .chip:active { transform: scale(.98); }
  .msg { min-height: 22px; font-size: 14px; color: var(--muted); margin-top: 8px; text-align: center; }
  h2 { font-size: 15px; color: var(--muted); margin: 28px 0 8px; font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  li .main { flex: 1; min-width: 0; }
  li .ex { font-weight: 600; }
  li .meta { font-size: 13px; color: var(--muted); }
  li .num { font-variant-numeric: tabular-nums; font-size: 18px; }
  .del {
    background: none; border: 0; color: var(--muted); font-size: 22px;
    width: 44px; height: 44px; border-radius: 10px;
  }
  .del:active { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Lifting</h1>
  <div class="sync" id="sync" role="status"></div>
</header>

<form id="form" autocomplete="off">
  <label for="exercise">Exercise</label>
  <input id="exercise" list="exlist" placeholder="e.g. Bench Press" required enterkeyhint="next">
  <datalist id="exlist"></datalist>
  <div class="chips" id="chips"></div>

  <div class="row">
    <div>
      <label for="weight">Weight (kg)</label>
      <div class="stepper">
        <button type="button" class="step" data-t="weight" data-d="-2.5">−</button>
        <input id="weight" type="number" inputmode="decimal" step="0.5" min="0" required>
        <button type="button" class="step" data-t="weight" data-d="2.5">+</button>
      </div>
    </div>
    <div>
      <label for="reps">Reps</label>
      <div class="stepper">
        <button type="button" class="step" data-t="reps" data-d="-1">−</button>
        <input id="reps" type="number" inputmode="numeric" step="1" min="1" required>
        <button type="button" class="step" data-t="reps" data-d="1">+</button>
      </div>
    </div>
  </div>

  <button class="log" type="submit">Log set</button>
  <div class="msg" id="msg"></div>
</form>

<h2>Recent sets</h2>
<ul id="recent"></ul>

<script type="module">
// All data goes through the Cortex core: it saves to this device first and syncs
// in the background, so this page works the same with or without a connection.
import * as cortex from "/core/cortex.js";

const $ = (id) => document.getElementById(id);
const UNIT = "kg";

// "Bench Press" <-> "bench_press": the metric stored in Cortex is a slug.
const toMetric = (name) => name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
const toName = (metric) => metric.split("_").filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

function isToday(iso) {
  return new Date(iso).toDateString() === new Date().toDateString();
}

let recent = [];

async function loadExercises() {
  const metrics = await cortex.listMetrics("lifting");
  $("exlist").innerHTML = metrics.map(m => `<option value="${esc(toName(m))}">`).join("");
  const current = toMetric($("exercise").value);
  $("chips").innerHTML = metrics.slice(0, 8).map(m =>
    `<button type="button" class="chip${m === current ? " on" : ""}" data-m="${esc(m)}">${esc(toName(m))}</button>`
  ).join("");
}

async function loadRecent() {
  recent = await cortex.listEntries({ module: "lifting", limit: 200 });
  $("recent").innerHTML = recent.slice(0, 30).map(e => {
    const t = new Date(e.recorded_at);
    const when = isToday(e.recorded_at)
      ? t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
      : t.toLocaleDateString([], { month: "short", day: "numeric" });
    const set = e.data.set ? ` · set ${esc(e.data.set)}` : "";
    return `<li>
      <div class="main"><div class="ex">${esc(toName(e.metric))}</div><div class="meta">${when}${set}</div></div>
      <div class="num">${esc(e.value)} ${esc(e.unit ?? "")} × ${esc(e.data.reps ?? "?")}</div>
      <button class="del" data-id="${esc(e.client_id)}" aria-label="Delete set">×</button>
    </li>`;
  }).join("") || `<li class="meta">No sets yet.</li>`;
}

async function showSync() {
  const { pending, online } = await cortex.getStatus();
  const el = $("sync");
  if (pending > 0) { el.textContent = `${pending} pending`; el.className = "sync pending"; }
  else if (online) { el.textContent = "synced"; el.className = "sync ok"; }
  else { el.textContent = online === false ? "offline" : ""; el.className = "sync"; }
}

const refresh = () => Promise.all([loadRecent(), loadExercises(), showSync()]);

function prefillFrom(metric) {
  // Pre-fill weight/reps from the last set of this exercise, so repeat sets are one tap.
  const last = recent.find(e => e.metric === metric);
  if (last) { $("weight").value = last.value; $("reps").value = last.data.reps ?? ""; }
}

$("chips").addEventListener("click", (ev) => {
  const m = ev.target.dataset.m;
  if (!m) return;
  $("exercise").value = toName(m);
  prefillFrom(m);
  loadExercises();
});

$("exercise").addEventListener("change", () => prefillFrom(toMetric($("exercise").value)));

document.querySelectorAll(".step").forEach(b => b.addEventListener("click", () => {
  const input = $(b.dataset.t);
  const next = (parseFloat(input.value) || 0) + parseFloat(b.dataset.d);
  input.value = Math.max(0, Math.round(next * 2) / 2);
}));

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const metric = toMetric($("exercise").value);
  if (!metric) return;
  const setNo = recent.filter(e => e.metric === metric && isToday(e.recorded_at)).length + 1;
  try {
    await cortex.addEntry({
      module: "lifting", metric,
      value: parseFloat($("weight").value), unit: UNIT,
      data: { reps: parseInt($("reps").value, 10), set: setNo },
    });
    $("msg").textContent = `Logged ${toName(metric)} set ${setNo} ✓`;
    if (navigator.vibrate) navigator.vibrate(30);
  } catch (err) {
    $("msg").textContent = "Couldn't save: " + err.message;
  }
});

$("recent").addEventListener("click", async (ev) => {
  const id = ev.target.dataset.id;
  if (!id || !confirm("Delete this set?")) return;
  await cortex.deleteEntry(id);
});

// Redraw whenever local data changes: after a log or delete, and after each sync
// (which may bring in sets logged on another device).
cortex.onChange(refresh);

refresh().then(() => {
  if (recent[0]) { $("exercise").value = toName(recent[0].metric); prefillFrom(recent[0].metric); }
  cortex.startAutoSync();
});

// The service worker keeps the app shell on the device so this page opens offline.
// Browsers only allow it on HTTPS or localhost.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch((err) => console.warn("No service worker:", err));
}
</script>
</body>
</html>
